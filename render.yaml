services:
  - type: web
    name: retentionpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    dockerCommand: uvicorn retentionpulse_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RETENTIONPULSE_OFFLINE_MODE
        value: "1"
      - key: RETENTIONPULSE_SECRET_KEY
        generateValue: true
      - key: RETENTIONPULSE_FRONTEND_URL
        value: https://retentionpulse.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://retentionpulse.vercel.app
      - key: RETENTIONPULSE_RP_ID
        value: retentionpulse.vercel.app
      - key: RETENTIONPULSE_ORIGIN
        value: https://retentionpulse.vercel.app
      - key: RETENTIONPULSE_MAX_UPLOAD_BYTES
        value: "262144000"
      - key: RETENTIONPULSE_DB_PATH
        value: /app/data/db.sqlite3
    disk:
      name: retentionpulse-data
      mountPath: /app/data
      sizeGB: 1
